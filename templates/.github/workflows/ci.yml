# CI: the required status check on `main`.
# Unit tests run untagged; Docker-backed tests (testcontainers) need `-tags=integration`.
# GitHub-hosted ubuntu runners have Docker, so testcontainers works without extra setup.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: unit tests
        run: go test ./... -race
      - name: integration tests
        run: go test -tags=integration ./... -race
