# Release: version from Conventional Commits → git tag → Docker image with the same version.
# See practices/releases.md.
#
# 1. Push to main: release-please opens/updates a release PR (next version + CHANGELOG.md).
# 2. You merge the release PR: release-please creates tag vX.Y.Z + GitHub release.
# 3. The same run builds and pushes ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y, :X, :latest, :sha-<short>.
#
# The image is built in this workflow on purpose: tags created with GITHUB_TOKEN don't trigger
# other workflows, so a separate `on: push: tags` workflow would never run.
#
# Repo settings: allow GitHub Actions to create pull requests (Settings → Actions → General).
# Check each action's README for current inputs:
#   https://github.com/googleapis/release-please-action
#   https://github.com/docker/metadata-action
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write       # tags, releases, CHANGELOG
  pull-requests: write  # the release PR
  packages: write       # push to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: go
          # More options (e.g. bump-minor-pre-major for 0.x) need a release-please-config.json.

      # Everything below runs only when a release was just created (the release PR was merged).
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4

      - if: ${{ steps.release.outputs.release_created }}
        uses: docker/setup-buildx-action@v3

      - if: ${{ steps.release.outputs.release_created }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ steps.release.outputs.release_created }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag_name }},enable=${{ !startsWith(steps.release.outputs.tag_name, 'v0.') }}
            type=sha
            type=raw,value=latest

      - if: ${{ steps.release.outputs.release_created }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
