# Copy the agent's logs and notes to the host before the VM is destroyed. Never fails the run.

- name: Find logs and notes
  become: true
  ansible.builtin.find:
    paths: ["{{ task_dir }}", "{{ task_dir }}/logs"]
    patterns: ["*.jsonl", "notes.md", "pr-title.txt", "pr-body.md", "skipped.txt"]
  register: agent_files
  ignore_errors: true

- name: Fetch them
  become: true
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ run_log_dir }}/"
    flat: true
  loop: "{{ agent_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  ignore_errors: true
